name: CI

on:
  push:
    branches:
      - main
      - develop
      - feature
      - 'feature/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
 
  host-tests:
    name: Host tests (CMake + ctest)
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar toolchain de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build

      - name: Cache de GoogleTest (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: gtest-${{ runner.os }}-${{ hashFiles('tests/CMakeLists.txt') }}
          restore-keys: |
            gtest-${{ runner.os }}-

      - name: Configurar (CMake)
        run: cmake -S . -B build -G Ninja -DGLP_BUILD_TESTS=ON

      - name: Compilar
        run: cmake --build build --parallel

      - name: Correr tests
        run: ctest --test-dir build --output-on-failure

  firmware-build:
    name: Firmware build (PlatformIO)
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache de PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Instalar PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Compilar firmware
        run: pio run -e esp32-s3-n16r8

  automerge:
    name: Auto-Merge Workflow
    needs: [host-tests, firmware-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge feature branch into develop and push
        if: github.event_name == 'push' && (github.ref_name == 'feature' || startsWith(github.ref_name, 'feature/'))
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout develop
          git merge --no-ff ${{ github.ref_name }} -m "Auto-merge ${{ github.ref_name }} to develop"
          git push origin develop

      - name: Merge develop into main and push
        if: github.event_name == 'push' && github.ref_name == 'develop'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --no-ff develop -m "Auto-merge develop to main"
          git push origin main

