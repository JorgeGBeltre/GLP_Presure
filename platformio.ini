; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
build_unflags = -std=gnu++11
build_flags = 
	-std=gnu++17
	-DBOARD_HAS_PSRAM
	-DTINY_GSM_MODEM_SIM7600
	-DMQTT_MAX_PROPS=32
	-DMQTT_DEFAULT_BUFFER_SIZE=4096
	-I src
lib_deps = 
	vshymanskyy/TinyGSM @ ^0.11.7
	mikalhart/TinyGPSPlus @ ^1.0.3
	https://github.com/JorgeGBeltre/ESP32_MQTTv5.git
	https://github.com/JorgeGBeltre/MQTTOTAv5.git
	bblanchon/ArduinoJson @ ^6.21.0
	h2zero/NimBLE-Arduino @ ^1.4.1
	esp32async/ESPAsyncWebServer @ ^3.0.0
	esp32async/AsyncTCP @ ^3.0.0
	adafruit/Adafruit ADS1X15 @ ^2.5.0
	adafruit/Adafruit MPU6050 @ ^2.2.6
