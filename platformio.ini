[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Hardware : ESP32-S3-WROOM-1-N16R8

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi   ; flash QIO + PSRAM octal (R8)

; Tabla de particiones de 16 MB del repo (dos slots de app de 4 MB con OTA).
board_build.partitions = partitions.csv

; La Clean Architecture (Domain/Application) usa C++17 (std::optional, std::clamp,
; inline variables). El core Arduino-ESP32 compila por defecto en gnu++11, así que
; hay que forzar C++17.
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DTINY_GSM_MODEM_SIM7600
  -DMQTT_MAX_PROPS=32
  -DMQTT_DEFAULT_BUFFER_SIZE=4096
  ; Raíz de includes para la Clean Architecture: permite
  ;   #include "Domain/...", "Application/...", "Infrastructure/..."
  ; desde cualquier .cpp bajo src/ (no sólo relativo al archivo).
  -I src

; Los tests de host (carpeta tests/) NO se compilan aquí: se corren con CMake.
; Ver CMakeLists.txt (HOST_BUILD) y tests/CMakeLists.txt.

lib_deps =
  ; Comunicación celular (SIM7600 4G/LTE)
  vshymanskyy/TinyGSM @ ^0.11.7

  ; GPS
  mikalhart/TinyGPSPlus @ ^1.0.3

  ; MQTT 5.0 — repo canónico
  https://github.com/JorgeGBeltre/ESP32_MQTTv5.git

  ; OTA sobre MQTT 5.0 — repo canónico
  https://github.com/JorgeGBeltre/MQTTOTAv5.git

  ; Requerido por MQTTOTAv5
  bblanchon/ArduinoJson @ ^6.21.0

  ; BLE (provisioning)
  h2zero/NimBLE-Arduino @ ^1.4.1

  ; WiFi AP / Portal Cautivo (provisioning) — fork mantenido (el paquete
  ; me-no-dev del registro tiene el src roto: WebAuthentication.cpp no se encuentra)
  esp32async/ESPAsyncWebServer @ ^3.0.0
  esp32async/AsyncTCP @ ^3.0.0

  ; ADC externo 16-bit (presión + temperatura Pt1000), Tier 0
  adafruit/Adafruit ADS1X15 @ ^2.5.0
